name: HelpDesk Pro CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_USERNAME: djahnavi
  BACKEND_IMAGE: djahnavi/helpdesk-backend
  FRONTEND_IMAGE: djahnavi/helpdesk-frontend

jobs:
  # ─── JOB 1: Code Quality & Security ────────────────────────────────────────
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Check for security vulnerabilities
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Check frontend security
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  # ─── JOB 2: Build & Test Backend ────────────────────────────────────────────
  test-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Verify server.js exists
        working-directory: backend
        run: |
          echo "Checking project structure..."
          ls -la src/
          echo "✅ Backend structure verified"

      - name: Check Node.js syntax
        working-directory: backend
        run: |
          node --check src/server.js
          echo "✅ Syntax check passed"

  # ─── JOB 3: Build & Test Frontend ───────────────────────────────────────────
  test-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://helpdesk-backend-fy1p.onrender.com/api
          VITE_SOCKET_URL: https://helpdesk-backend-fy1p.onrender.com

      - name: Verify build output
        working-directory: frontend
        run: |
          echo "Build output:"
          ls -lh dist/
          echo "✅ Frontend build successful"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 1

  # ─── JOB 4: Docker Build & Push ─────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push to Hub
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "backend_tags=${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "frontend_tags=${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build & Push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.backend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build & Push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.frontend_tags }}
          build-args: |
            VITE_API_URL=https://helpdesk-backend-fy1p.onrender.com/api
            VITE_SOCKET_URL=https://helpdesk-backend-fy1p.onrender.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image build summary
        run: |
          echo "## 🐳 Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ─── JOB 5: Deploy to Render ────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://helpdesk-pro-omega.vercel.app

    steps:
      - name: Trigger Render backend deploy
        run: |
          echo "Triggering Render deployment..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP Status: %{http_code}\n"

      - name: Wait for deployment
        run: |
          echo "Waiting 30 seconds for Render to start deploying..."
          sleep 30

      - name: Health check backend
        run: |
          echo "Checking backend health..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://helpdesk-backend-fy1p.onrender.com/)
            echo "Attempt $i - HTTP Status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend is healthy!"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "⚠️ Backend health check timed out (Render free tier may take 50s to wake)"
            fi
            sleep 15
          done

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | https://helpdesk-pro-omega.vercel.app |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend API | https://helpdesk-backend-fy1p.onrender.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
